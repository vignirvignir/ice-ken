name: Conventional Commits

# SECURITY: This workflow uses pull_request_target to write check statuses on
# fork PRs. It MUST NEVER check out or execute code from the PR head branch.
on:
  pull_request_target:
    types: [opened, edited, synchronize]


permissions:
  contents: read
  pull-requests: read
  statuses: write


jobs:
  semantic-pull-request:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: true
          wip: true
