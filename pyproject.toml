[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ice-ken"
version = "2.0.2"
description = "Validate, parse, format, mask, and generate Icelandic national identification numbers (kennitala / kennitölur)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Vignir Lydsson"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

keywords = ["kennitala", "kennitolur", "iceland", "icelandic", "national-id", "personal-id", "validation", "thjodskra", "registers-iceland"]

[project.optional-dependencies]
# Hardened XML parsing for ice_ken.loaders (guards against entity expansion).
xml = ["defusedxml>=0.7"]
test = ["pytest>=8,<10"]

[project.urls]
Homepage = "https://github.com/vignirvignir/ice-ken"
Repository = "https://github.com/vignirvignir/ice-ken"
Changelog = "https://github.com/vignirvignir/ice-ken/blob/main/CHANGELOG.md"
Issues = "https://github.com/vignirvignir/ice-ken/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
ice_ken = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ice_ken*"]

[tool.semantic_release]
# Use Conventional Commits to determine the next version.
branch = "main"
version_toml = ["pyproject.toml:project.version"]
changelog_file = "CHANGELOG.md"
build_command = "python -m build"
assets = []
commit_parser = "conventional"
